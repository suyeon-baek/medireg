name: GitHub Pages 배포

on:
  push:
    branches: [main]
    paths:
      - 'dashboard/**'
      - 'data/**'        # 크롤링 데이터 변경 시에도 Pages 재배포
      - '.nojekyll'      # Jekyll 설정 변경 시
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # 레포 루트 전체를 배포: dashboard/index.html → /dashboard/, data/ → /data/
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
